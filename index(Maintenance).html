<!DOCTYPE HTML>
<html>
<head>
  <title>Technetium Engineering - Maintenance</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #026873, #013440);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .box {
      max-width: 700px;
      padding: 2em;
    }

    img {
      max-width: 220px;
      margin-bottom: 2em;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 0.5em;
    }

    p {
      font-size: 1.2em;
      color: rgba(255,255,255,0.75);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="images/logo.png" alt="Technetium Engineering Logo">
    <h1>Website Under Maintenance</h1>
    <p>
      Technetium Engineering is currently updating the website.<br>
      Please check back soon.
    </p>
  </div>
</body>
</html>
